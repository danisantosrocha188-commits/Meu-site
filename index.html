<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHER OS</title>
    <style>
        :root {
            --bg-color: #030708;
            --main-color: #00f3ff;
            --err-color: #ff0055;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--main-color);
            font-family: var(--font-mono);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            padding: 15px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--main-color);
            padding-bottom: 10px;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 8px var(--main-color);
        }

        .arc-reactor-small {
            width: 20px;
            height: 20px;
            border: 2px solid var(--main-color);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--main-color);
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .mensagem {
            font-size: 0.9rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .mensagem.erro {
            color: var(--err-color);
            text-shadow: 0 0 5px var(--err-color);
        }

        .center-reactor {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
        }

        .core {
            width: 50px;
            height: 50px;
            border: 2px dashed var(--main-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        .core-dot {
            width: 12px;
            height: 12px;
            background-color: var(--main-color);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--main-color);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            opacity: 0.8;
            margin-bottom: 8px;
        }

        .input-area {
            display: flex;
            gap: 5px;
            border: 1px solid var(--main-color);
            padding: 5px;
            background: rgba(0, 243, 255, 0.05);
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--main-color);
            font-family: var(--font-mono);
            outline: none;
            padding: 5px;
        }

        button.btn-send {
            background: transparent;
            border: 1px solid var(--main-color);
            color: var(--main-color);
            padding: 5px 15px;
            cursor: pointer;
        }

        .reatores-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-top: 8px;
        }

        .btn-reator {
            background: transparent;
            border: 1px solid var(--main-color);
            color: var(--main-color);
            font-size: 0.6rem;
            padding: 8px 2px;
            text-align: center;
            cursor: pointer;
        }

        .btn-reator.ativo {
            background: var(--main-color);
            color: var(--bg-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">AETHER OS</div>
        <div class="arc-reactor-small"></div>
    </header>

    <div id="chat-container">
        <div class="mensagem">>> AETHER: Sistemas operacionais prontos. Como posso ajudar, Senhor?</div>
    </div>

    <div class="center-reactor">
        <div class="core">
            <div class="core-dot"></div>
        </div>
    </div>

    <div class="stats">
        <div>NUCLEO: 100%<br>TENSAO: 14.4V</div>
        <div style="text-align: right;">SISTEMA: OMNINI<br>STATUS: ONLINE</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Inserir diretriz..." onkeypress="handleKeyPress(event)">
        <button class="btn-send" onclick="enviarMensagem()">>></button>
    </div>

    <div class="reatores-grid">
        <button class="btn-reator" id="reator-1" onclick="toggleReator(1)">REATOR 01<br>Voz</button>
        <button class="btn-reator" id="reator-2" onclick="toggleReator(2)">REATOR 02<br>Contínuo</button>
        <button class="btn-reator" id="reator-3" onclick="toggleReator(3)">REATOR 03<br>Limpar</button>
        <button class="btn-reator" id="reator-4" onclick="toggleReator(4)">REATOR 04<br>Flash</button>
    </div>

    <script>
        const API_URL = "https://meu-site-hs72.onrender.com/chat";
        let lanternaTrack = null;
        let estado = { vozAtiva: false, ligacaoContinua: false };

        function adicionarMensagem(autor, texto, erro = false) {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = `mensagem ${erro ? 'erro' : ''}`;
            div.innerText = `${erro ? '!! ERRO: ' : '>> ' + autor + ': '}${texto}`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        async function enviarMensagem() {
            const input = document.getElementById('userInput');
            const texto = input.value.trim();
            if (!texto) return;

            adicionarMensagem('SENHOR', texto);
            input.value = '';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: texto })
                });

                const data = await response.json();
                if (data.reply) {
                    adicionarMensagem('AETHER', data.reply);
                } else {
                    adicionarMensagem('AETHER', 'Erro no Gemini.', true);
                }
            } catch (err) {
                adicionarMensagem('AETHER', 'Falha na conexão com o servidor.', true);
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') enviarMensagem();
        }

        async function toggleReator(n) {
            const btn = document.getElementById('reator-' + n);
            if (!btn) return;
            btn.classList.toggle('ativo');
            const ativo = btn.classList.contains('ativo');

            switch (n) {
                case 1:
                    estado.vozAtiva = ativo;
                    break;
                case 2:
                    estado.ligacaoContinua = ativo;
                    break;
                case 3:
                    document.getElementById('chat-container').innerHTML = '';
                    btn.classList.remove('ativo');
                    adicionarMensagem('AETHER', 'Registro de tela limpo, Senhor.');
                    break;
                case 4:
                    if (ativo) {
                        try {
                            const stream = await navigator.mediaDevices.getUserMedia({
                                video: { facingMode: 'environment' }
                            });
                            lanternaTrack = stream.getVideoTracks()[0];
                            const capabilities = lanternaTrack.getCapabilities();
                            
                            if (capabilities.torch) {
                                await lanternaTrack.applyConstraints({
                                    advanced: [{ torch: true }]
                                });
                                adicionarMensagem('AETHER', 'Sistemas iluminadores ativados, Senhor.');
                            } else {
                                adicionarMensagem('AETHER', 'Dispositivo não possui suporte a flash/lanterna.', true);
                                btn.classList.remove('ativo');
                            }
                        } catch (err) {
                            adicionarMensagem('AETHER', 'Permissão negada para acessar o Flash.', true);
                            btn.classList.remove('ativo');
                        }
                    } else {
                        if (lanternaTrack) {
                            lanternaTrack.stop();
                            lanternaTrack = null;
                        }
                        adicionarMensagem('AETHER', 'Sistemas iluminadores desligados.');
                    }
                    break;
            }
        }
    </script>
</body>
    </html>
