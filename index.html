<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AETHER OS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            background-color: #000000 !important;
            color: #00f0ff !important;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
        }

        .interface-hud {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            justify-content: space-between;
            padding: 8px;
            background: #000000;
        }

        .topo-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 36px;
            padding: 0 5px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
            flex-shrink: 0;
        }

        .aether-logo-title {
            font-weight: bold;
            font-size: 0.9rem;
            color: #00f0ff;
            letter-spacing: 1px;
            text-shadow: 0 0 5px #00f0ff;
        }

        .globe-container {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #globeCanvas { width: 28px; height: 28px; display: block; }

        #scroll-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
        }

        /* ESTILO LIMPO DA MENSAGEM (SEM BORDAS/RETÂNGULOS) */
        .chat-msg {
            position: relative;
            padding: 2px 26px 2px 0px;
            font-size: 0.82rem;
            color: #00f0ff;
            background: transparent; /* Sem fundo */
            border: none; /* Sem retângulo */
            word-break: break-word;
            line-height: 1.35;
            white-space: pre-wrap;
            user-select: text;
            -webkit-user-select: text;
        }

        /* Botão dos 3 pontinhos no canto direito */
        .msg-options-btn {
            position: absolute;
            right: 0;
            top: 0;
            background: transparent;
            border: none;
            color: #00f0ff;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
            opacity: 0.8;
        }

        .msg-options-btn:hover {
            opacity: 1;
        }

        /* Menu Popup para apagar */
        .msg-menu-popup {
            display: none;
            position: absolute;
            right: 0;
            top: 22px;
            background: #000;
            border: 1px solid #ff0055;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.6);
            z-index: 100;
            border-radius: 2px;
        }

        .msg-menu-popup.ativo {
            display: block;
        }

        .btn-delete-msg {
            background: transparent;
            border: none;
            color: #ff0055;
            padding: 6px 12px;
            font-size: 0.72rem;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
            font-family: inherit;
        }

        .btn-delete-msg:hover {
            background: rgba(255, 0, 85, 0.25);
        }

        .painel-inferior-fixo {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
            padding-top: 4px;
            background: #000;
        }

        .reator-arc-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 2px 0;
        }

        .reator-arc {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px dashed #00f0ff;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
            animation: girarReator 12s linear infinite;
        }

        .reator-arc.ouvidor {
            border-color: #ff0055;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.8);
            animation: girarReator 2s linear infinite;
        }

        .reator-nucleo {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #00f0ff;
            box-shadow: 0 0 15px #00f0ff;
        }

        @keyframes girarReator {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .status-painel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.55rem;
            color: #00f0ff;
            padding: 0 2px;
        }

        .hud-coluna { display: flex; flex-direction: column; gap: 1px; }
        .hud-coluna.direita { text-align: right; }

        #input-bar { display: flex; gap: 4px; }

        .caixa-texto {
            flex: 1;
            background: #000;
            border: 1px solid #00f0ff;
            color: #00f0ff;
            padding: 6px;
            font-size: 0.75rem;
            outline: none;
            resize: none;
            height: 36px;
            user-select: text;
            -webkit-user-select: text;
        }

        .caixa-texto::placeholder { color: rgba(0, 240, 255, 0.4); }

        .btn-icone, .btn-enviar {
            background: #000;
            border: 1px solid #00f0ff;
            color: #00f0ff;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        .btn-enviar { background: #00f0ff; color: #000; font-weight: bold; }

        #reactors-panel {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }

        .btn-reator {
            background: #000;
            border: 1px solid #00f0ff;
            color: #00f0ff;
            padding: 4px 1px;
            font-size: 0.55rem;
            text-align: center;
            cursor: pointer;
            line-height: 1.1;
        }

        .btn-reator.ativo {
            background: #00f0ff;
            color: #000;
            box-shadow: 0 0 6px #00f0ff;
        }

        .btn-reator small { font-size: 0.45rem; display: block; opacity: 0.8; }
    </style>
</head>
<body>

    <div class="interface-hud">
        <header class="topo-hud">
            <span class="aether-logo-title">AETHER OS</span>
            <div class="globe-container">
                <canvas id="globeCanvas" width="28" height="28"></canvas>
            </div>
        </header>

        <main id="scroll-wrapper"></main>

        <div class="painel-inferior-fixo">
            <div class="reator-arc-container">
                <div class="reator-arc" id="reator-visual">
                    <div class="reator-nucleo"></div>
                </div>
            </div>

            <div class="status-painel">
                <div class="hud-coluna esquerda">
                    <span>NÚCLEO: 100%</span>
                    <span>TENSÃO: 14.4V</span>
                    <span>TEMP: 21°C</span>
                    <span>MODO: MULTIMÍDIA</span>
                </div>
                <div class="hud-coluna direita">
                    <span>FREQ: 60Hz</span>
                    <span>SISTEMA: MULTI_IA</span>
                    <span>PORTAL: ATIVO</span>
                    <span>STATUS: COMPILADO</span>
                </div>
            </div>

            <footer id="input-bar">
                <input type="file" id="file-input" accept="image/*" style="display: none;">
                <button id="btn-attach" class="btn-icone" onclick="document.getElementById('file-input').click()">&#128206;</button>
                <textarea id="txt-input" class="caixa-texto" rows="1" placeholder="Digite uma pergunta ou diretriz..."></textarea>
                <button id="btn-send" class="btn-enviar" onclick="enviarDiretriz()">&gt;&gt;</button>
            </footer>

            <section id="reactors-panel">
                <button class="btn-reator" id="reator-1" onclick="toggleReator(1)">
                    REATOR 01<br><small>Feedback Voz</small>
                </button>
                <button class="btn-reator" id="reator-2" onclick="toggleReator(2)">
                    REATOR 02<br><small>Ligação Contínua</small>
                </button>
                <button class="btn-reator" id="reator-3" onclick="toggleReator(3)">
                    REATOR 03<br><small>Limpar Tela</small>
                </button>
                <button class="btn-reator" id="reator-4" onclick="toggleReator(4)">
                    REATOR 04<br><small>Flash Fast</small>
                </button>
            </section>
        </div>
    </div>

    <script>
        let ligacaoContinuaAtiva = false;
        let vozFeedbackAtiva = false;
        let reativoVoz = null;
        let lanternaTrack = null;

        window.onload = function() {
            desenharGlobo3D();
            adicionarMensagem("AETHER OS", "Sistemas operacionais prontos. Como posso ajudar, Senhor?");
            inicializarReconhecimentoVoz();
        };

        document.addEventListener('click', function(e) {
            if (!e.target.classList.contains('msg-options-btn')) {
                document.querySelectorAll('.msg-menu-popup').forEach(m => m.classList.remove('ativo'));
            }
        });

        function desenharGlobo3D() {
            const canvas = document.getElementById("globeCanvas");
            if (!canvas) return;
            const ctx = canvas.getContext("2d");
            let angle = 0;

            function render() {
                ctx.clearRect(0, 0, 28, 28);
                ctx.strokeStyle = "#00f0ff";
                ctx.lineWidth = 1.2;
                const cx = 14, cy = 14, r = 10;

                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.stroke();

                ctx.beginPath();
                ctx.ellipse(cx, cy, r, Math.max(1, r * Math.abs(Math.sin(angle))), 0, 0, Math.PI * 2);
                ctx.stroke();

                angle += 0.04;
                requestAnimationFrame(render);
            }
            render();
        }

        async function enviarDiretriz(textoDireto = null) {
            const inputArea = document.getElementById("txt-input");
            const textoUsuario = textoDireto || (inputArea ? inputArea.value.trim() : "");

            if (!textoUsuario) return;

            adicionarMensagem("SENHOR", textoUsuario);
            if (inputArea && !textoDireto) inputArea.value = "";

            const idCarregando = adicionarMensagem("AETHER OS", "Processando diretriz nos núcleos...");

            try {
                const res = await fetch("/.netlify/functions/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: textoUsuario })
                });

                const data = await res.json();

                if (res.ok && data.resposta) {
                    atualizarMensagem(idCarregando, "AETHER OS", data.resposta);
                    falarTexto(data.resposta);
                } else {
                    atualizarMensagem(idCarregando, "AETHER OS", "Erro: " + (data.error || "Não foi possível conectar ao servidor."));
                }
            } catch (err) {
                atualizarMensagem(idCarregando, "AETHER OS", "Erro de conexão com o servidor Netlify.");
            }
        }

        function falarTexto(texto) {
            if (!vozFeedbackAtiva && !ligacaoContinuaAtiva) return;
            window.speechSynthesis.cancel();
            const fala = new SpeechSynthesisUtterance(texto);
            fala.lang = "pt-BR";
            fala.onend = () => {
                if (ligacaoContinuaAtiva && reativoVoz) {
                    try { reativoVoz.start(); } catch(e){}
                }
            };
            window.speechSynthesis.speak(fala);
        }

        function inicializarReconhecimentoVoz() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;

            reativoVoz = new SpeechRecognition();
            reativoVoz.lang = 'pt-BR';
            reativoVoz.continuous = false;

            reativoVoz.onstart = () => {
                document.getElementById("reator-visual").classList.add("ouvidor");
            };

            reativoVoz.onend = () => {
                document.getElementById("reator-visual").classList.remove("ouvidor");
            };

            reativoVoz.onresult = (event) => {
                const comando = event.results[0][0].transcript;
                enviarDiretriz(comando);
            };
        }

        function toggleReator(numero) {
            const btn = document.getElementById(`reator-${numero}`);
            if (btn) btn.classList.toggle("ativo");

            if (numero === 1) {
                vozFeedbackAtiva = btn.classList.contains("ativo");
            }

            if (numero === 2) {
                ligacaoContinuaAtiva = btn.classList.contains("ativo");
                if (ligacaoContinuaAtiva && reativoVoz) {
                    try { reativoVoz.start(); } catch(e){}
                } else if (reativoVoz) {
                    reativoVoz.stop();
                }
            }

            if (numero === 3) {
                const wrapper = document.getElementById("scroll-wrapper");
                if (wrapper) wrapper.innerHTML = "";
                adicionarMensagem("AETHER OS", "Sistemas operacionais prontos. Como posso ajudar, Senhor?");
            }

            if (numero === 4) {
                const estaAtivo = btn.classList.contains("ativo");
                if (estaAtivo) {
                    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                        .then(stream => {
                            lanternaTrack = stream.getVideoTracks()[0];
                            lanternaTrack.applyConstraints({ advanced: [{ torch: true }] });
                        })
                        .catch(() => btn.classList.remove("ativo"));
                } else if (lanternaTrack) {
                    lanternaTrack.stop();
                }
            }
        }

        function toggleMenuMsg(idMsg) {
            document.querySelectorAll('.msg-menu-popup').forEach(m => {
                if (m.id !== 'menu-' + idMsg) m.classList.remove('ativo');
            });

            const menu = document.getElementById('menu-' + idMsg);
            if (menu) menu.classList.toggle('ativo');
        }

        function deletarMensagem(idMsg) {
            const msg = document.getElementById(idMsg);
            if (msg) msg.remove();
        }

        function adicionarMensagem(autor, texto) {
            const scrollWrapper = document.getElementById("scroll-wrapper");
            if (!scrollWrapper) return;

            const msgDiv = document.createElement("div");
            const idUnico = "msg-" + Date.now();

            msgDiv.id = idUnico;
            msgDiv.className = "chat-msg";
            
            msgDiv.innerHTML = `
                <button class="msg-options-btn" onclick="toggleMenuMsg('${idUnico}')">&#8942;</button>
                <div class="msg-menu-popup" id="menu-${idUnico}">
                    <button class="btn-delete-msg" onclick="deletarMensagem('${idUnico}')">&#128465; Apagar mensagem</button>
                </div>
                <span class="msg-content"><strong>&gt;&gt; ${autor}:</strong> ${texto}</span>
            `;

            scrollWrapper.appendChild(msgDiv);
            scrollWrapper.scrollTop = scrollWrapper.scrollHeight;

            return idUnico;
        }

        function atualizarMensagem(id, autor, texto) {
            const msgDiv = document.getElementById(id);
            if (msgDiv) {
                const spanContent = msgDiv.querySelector('.msg-content');
                if (spanContent) {
                    spanContent.innerHTML = `<strong>&gt;&gt; ${autor}:</strong> ${texto}`;
                } else {
                    msgDiv.innerHTML = `
                        <button class="msg-options-btn" onclick="toggleMenuMsg('${id}')">&#8942;</button>
                        <div class="msg-menu-popup" id="menu-${id}">
                            <button class="btn-delete-msg" onclick="deletarMensagem('${id}')">&#128465; Apagar mensagem</button>
                        </div>
                        <span class="msg-content"><strong>&gt;&gt; ${autor}:</strong> ${texto}</span>
                    `;
                }
                const scrollWrapper = document.getElementById("scroll-wrapper");
                if (scrollWrapper) scrollWrapper.scrollTop = scrollWrapper.scrollHeight;
            }
        }
    </script>
</body>
                        </html>
