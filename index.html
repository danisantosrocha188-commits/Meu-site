<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AETHER OS</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        html, body {
            background-color: #000;
            color: #00f0ff;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
        }

        .interface-hud {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            background: #000;
        }

        .topo-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 40px;
            padding: 0 10px;
            border-bottom: 1px solid rgba(0,240,255,0.25);
            flex-shrink: 0;
        }

        .aether-logo-title {
            font-weight: bold;
            font-size: 0.9rem;
            color: #00f0ff;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #00f0ff;
        }

        .globe-container { width: 28px; height: 28px; }
        #globeCanvas { display: block; width: 28px; height: 28px; }

        #scroll-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
            scroll-behavior: smooth;
        }

        #scroll-wrapper::-webkit-scrollbar { width: 3px; }
        #scroll-wrapper::-webkit-scrollbar-track { background: #000; }
        #scroll-wrapper::-webkit-scrollbar-thumb { background: rgba(0,240,255,0.3); }

        .chat-msg {
            position: relative;
            width: 100%;
            padding-right: 24px;
            font-size: 0.8rem;
            color: #00f0ff;
            line-height: 1.45;
            white-space: pre-wrap;
            word-break: break-word;
            user-select: text;
            -webkit-user-select: text;
            animation: fadeIn 0.2s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .chat-msg.aether { color: #00f0ff; }
        .chat-msg.user   { color: rgba(0,240,255,0.75); }
        .chat-msg.erro   { color: #ff0055; }

        .msg-options-btn {
            position: absolute;
            right: 0;
            top: 0;
            background: transparent;
            border: none;
            color: #00f0ff;
            font-size: 1rem;
            cursor: pointer;
            padding: 0 3px;
            opacity: 0.4;
            line-height: 1;
            transition: opacity 0.2s;
        }
        .msg-options-btn:hover { opacity: 1; }

        .msg-menu-popup {
            display: none;
            position: absolute;
            right: 0;
            top: 20px;
            background: #000;
            border: 1px solid #ff0055;
            border-radius: 2px;
            z-index: 100;
        }
        .msg-menu-popup.ativo { display: block; }

        .btn-delete-msg {
            background: transparent;
            border: none;
            color: #ff0055;
            padding: 5px 10px;
            font-size: 0.65rem;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
            display: block;
            width: 100%;
            text-align: left;
        }
        .btn-delete-msg:hover { background: rgba(255,0,85,0.15); }

        .painel-inferior-fixo {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
            padding: 6px 8px 8px;
            background: #000;
            border-top: 1px solid rgba(0,240,255,0.15);
        }

        .reator-arc-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .reator-arc {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 2px dashed #00f0ff;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 14px rgba(0,240,255,0.35), inset 0 0 8px rgba(0,240,255,0.1);
            animation: girarReator 10s linear infinite;
        }

        .reator-arc.ouvindo {
            border-color: #ff0055;
            box-shadow: 0 0 18px rgba(255,0,85,0.7), inset 0 0 10px rgba(255,0,85,0.2);
            animation-duration: 1.5s;
        }

        .reator-nucleo {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #00f0ff;
            box-shadow: 0 0 16px #00f0ff, 0 0 30px rgba(0,240,255,0.4);
            transition: background 0.3s, box-shadow 0.3s;
        }

        .reator-arc.ouvindo .reator-nucleo {
            background: #ff0055;
            box-shadow: 0 0 16px #ff0055, 0 0 30px rgba(255,0,85,0.4);
        }

        @keyframes girarReator {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .status-painel {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-size: 0.52rem;
            color: #00f0ff;
            opacity: 0.8;
            padding: 0 2px;
            letter-spacing: 0.5px;
        }

        .hud-coluna { display: flex; flex-direction: column; gap: 2px; line-height: 1.3; }
        .hud-coluna.direita { text-align: right; }

        #input-bar {
            display: flex;
            gap: 5px;
            align-items: flex-end;
        }

        .caixa-texto {
            flex: 1;
            background: #000;
            border: 1px solid rgba(0,240,255,0.6);
            color: #00f0ff;
            padding: 7px 8px;
            font-size: 0.75rem;
            font-family: inherit;
            outline: none;
            resize: none;
            min-height: 36px;
            max-height: 100px;
            border-radius: 0;
            transition: border-color 0.2s;
            user-select: text;
            -webkit-user-select: text;
        }
        .caixa-texto:focus { border-color: #00f0ff; box-shadow: 0 0 6px rgba(0,240,255,0.3); }
        .caixa-texto::placeholder { color: rgba(0,240,255,0.35); }

        .btn-icone, .btn-enviar {
            background: #000;
            border: 1px solid rgba(0,240,255,0.6);
            color: #00f0ff;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-family: inherit;
            flex-shrink: 0;
            transition: background 0.15s, box-shadow 0.15s;
        }
        .btn-icone:hover { background: rgba(0,240,255,0.08); }

        .btn-enviar {
            background: #00f0ff;
            color: #000;
            font-weight: bold;
            font-size: 0.75rem;
            letter-spacing: 1px;
            border-color: #00f0ff;
        }
        .btn-enviar:hover { box-shadow: 0 0 10px rgba(0,240,255,0.5); }
        .btn-enviar:disabled { opacity: 0.5; cursor: not-allowed; }

        #reactors-panel {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        .btn-reator {
            background: #000;
            border: 1px solid rgba(0,240,255,0.5);
            color: #00f0ff;
            padding: 5px 2px;
            font-size: 0.52rem;
            text-align: center;
            cursor: pointer;
            line-height: 1.2;
            font-family: inherit;
            letter-spacing: 0.5px;
            transition: background 0.15s, box-shadow 0.15s;
        }
        .btn-reator:hover { background: rgba(0,240,255,0.07); }

        .btn-reator.ativo {
            background: #00f0ff;
            color: #000;
            box-shadow: 0 0 8px rgba(0,240,255,0.6);
            border-color: #00f0ff;
            font-weight: bold;
        }

        .btn-reator small {
            font-size: 0.42rem;
            display: block;
            opacity: 0.75;
            margin-top: 2px;
        }

        .msg-carregando::after {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            border: 1px solid #00f0ff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 6px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="interface-hud">
    <header class="topo-hud">
        <span class="aether-logo-title">AETHER OS</span>
        <div class="globe-container">
            <canvas id="globeCanvas" width="28" height="28"></canvas>
        </div>
    </header>

    <main id="scroll-wrapper"></main>

    <div class="painel-inferior-fixo">

        <div class="reator-arc-container">
            <div class="reator-arc" id="reator-visual">
                <div class="reator-nucleo"></div>
            </div>
        </div>

        <div class="status-painel">
            <div class="hud-coluna esquerda">
                <span>NUCLEO: 100%</span>
                <span>TENSAO: 14.4V</span>
                <span>TEMP: 21&deg;C</span>
                <span>MODO: MULTI_IA</span>
            </div>
            <div class="hud-coluna direita">
                <span>FREQ: 60Hz</span>
                <span>SISTEMA: GEMINI</span>
                <span>PORTAL: ATIVO</span>
                <span>STATUS: ONLINE</span>
            </div>
        </div>

        <div id="input-bar">
            <input type="file" id="file-input" accept="image/*" style="display:none">
            <button class="btn-icone" id="btn-attach" title="Anexar arquivo">&#128206;</button>
            <textarea id="txt-input" class="caixa-texto" rows="1" placeholder="Inserir diretriz..."></textarea>
            <button class="btn-enviar" id="btn-send" title="Enviar">&gt;&gt;</button>
        </div>

        <section id="reactors-panel">
            <button class="btn-reator" id="reator-1">REATOR 01<br><small>Feedback Voz</small></button>
            <button class="btn-reator" id="reator-2">REATOR 02<br><small>Ligacao Cont.</small></button>
            <button class="btn-reator" id="reator-3">REATOR 03<br><small>Limpar Tela</small></button>
            <button class="btn-reator" id="reator-4">REATOR 04<br><small>Flash Fast</small></button>
        </section>

    </div>
</div>

<script>
    const estado = { vozAtiva: false, ligacaoContinua: false, enviando: false };
    let reconhecimento = null;
    let idMsgCarregando = null;

    window.addEventListener('load', () => {
        desenharGlobo();
        adicionarMensagem('AETHER', 'Sistemas operacionais prontos. Como posso ajudar, Senhor?');
        inicializarVoz();
        configurarEventos();
    });

    function configurarEventos() {
        document.getElementById('btn-send').addEventListener('click', () => enviar());
        document.getElementById('btn-attach').addEventListener('click', () => {
            document.getElementById('file-input').click();
        });
        document.getElementById('reator-1').addEventListener('click', () => toggleReator(1));
        document.getElementById('reator-2').addEventListener('click', () => toggleReator(2));
        document.getElementById('reator-3').addEventListener('click', () => toggleReator(3));
        document.getElementById('reator-4').addEventListener('click', () => toggleReator(4));

        document.getElementById('txt-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                enviar();
            }
        });

        document.getElementById('txt-input').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });

        document.addEventListener('click', (e) => {
            if (!e.target.classList.contains('msg-options-btn')) {
                document.querySelectorAll('.msg-menu-popup.ativo')
                    .forEach(m => m.classList.remove('ativo'));
            }
        });
    }

    function desenharGlobo() {
        const canvas = document.getElementById('globeCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let angulo = 0;
        (function render() {
            ctx.clearRect(0, 0, 28, 28);
            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 1.2;
            const cx = 14, cy = 14, r = 10;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.stroke();
            const rx = r * Math.abs(Math.sin(angulo));
            if (rx > 0.5) {
                ctx.beginPath();
                ctx.ellipse(cx, cy, rx, r, 0, 0, Math.PI * 2);
                ctx.stroke();
            }
            angulo += 0.04;
            requestAnimationFrame(render);
        })();
    }

    async function enviar(textoDireto = null) {
        if (estado.enviando) return;
        const input = document.getElementById('txt-input');
        const texto = textoDireto || (input ? input.value.trim() : '');
        if (!texto) return;

        estado.enviando = true;
        document.getElementById('btn-send').disabled = true;
        adicionarMensagem('USER', texto);

        if (input && !textoDireto) {
            input.value = '';
            input.style.height = 'auto';
        }

        idMsgCarregando = adicionarMensagem('AETHER', 'Processando diretriz nos nucleos...', true);

        try {
            // ROTA CONECTADA AO RENDER:
            const res = await fetch('https://meu-site-hs72.onrender.com/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: texto })
            });
            const data = await res.json();

            if (res.ok && data.resposta) {
                atualizarMensagem(idMsgCarregando, 'AETHER', data.resposta);
                falar(data.resposta);
            } else {
                atualizarMensagem(idMsgCarregando, 'ERRO', data.error || 'Falha na conexao com os nucleos.', true);
            }
        } catch (err) {
            atualizarMensagem(idMsgCarregando, 'ERRO', 'Falha de rede. Verifique sua conexao, Senhor.', true);
        } finally {
            estado.enviando = false;
            document.getElementById('btn-send').disabled = false;
            idMsgCarregando = null;
        }
    }

    function criarElementoMensagem(id, autor, texto, carregando = false) {
        const div = document.createElement('div');
        div.id = id;
        div.className = 'chat-msg ' + (autor === 'USER' ? 'user' : autor === 'ERRO' ? 'erro' : 'aether');
        if (carregando) div.classList.add('msg-carregando');

        const btnOpt = document.createElement('button');
        btnOpt.className = 'msg-options-btn';
        btnOpt.textContent = '\u22EE';
        btnOpt.setAttribute('aria-label', 'Opcoes');
        btnOpt.addEventListener('click', (e) => { e.stopPropagation(); toggleMenu(id); });

        const menu = document.createElement('div');
        menu.className = 'msg-menu-popup';
        menu.id = 'menu-' + id;

        const btnDel = document.createElement('button');
        btnDel.className = 'btn-delete-msg';
        btnDel.textContent = 'Apagar';
        btnDel.addEventListener('click', () => { document.getElementById(id)?.remove(); });
        menu.appendChild(btnDel);

        const span = document.createElement('span');
        span.className = 'msg-content';
        const prefixo = autor === 'USER' ? '>> SENHOR' : autor === 'ERRO' ? '!! ERRO' : '>> AETHER';
        span.textContent = prefixo + ': ' + texto;

        div.appendChild(btnOpt);
        div.appendChild(menu);
        div.appendChild(span);
        return div;
    }

    function adicionarMensagem(autor, texto, carregando = false) {
        const wrapper = document.getElementById('scroll-wrapper');
        const id = 'msg-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
        const el = criarElementoMensagem(id, autor, texto, carregando);
        wrapper.appendChild(el);
        wrapper.scrollTop = wrapper.scrollHeight;
        return id;
    }

    function atualizarMensagem(id, autor, texto, erro = false) {
        const div = document.getElementById(id);
        if (!div) return;
        div.classList.remove('msg-carregando');
        div.className = 'chat-msg ' + (erro ? 'erro' : autor === 'USER' ? 'user' : 'aether');
        const span = div.querySelector('.msg-content');
        if (span) {
            const prefixo = erro ? '!! ERRO' : autor === 'USER' ? '>> SENHOR' : '>> AETHER';
            span.textContent = prefixo + ': ' + texto;
        }
        const wrapper = document.getElementById('scroll-wrapper');
        if (wrapper) wrapper.scrollTop = wrapper.scrollHeight;
    }

    function toggleMenu(id) {
        document.querySelectorAll('.msg-menu-popup.ativo').forEach(m => {
            if (m.id !== 'menu-' + id) m.classList.remove('ativo');
        });
        document.getElementById('menu-' + id)?.classList.toggle('ativo');
    }

    function falar(texto) {
        if (!estado.vozAtiva && !estado.ligacaoContinua) return;
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const fala = new SpeechSynthesisUtterance(texto);
        fala.lang = 'pt-BR';
        fala.rate = 1.0;
        fala.pitch = 1.0;
        fala.onend = () => {
            if (estado.ligacaoContinua && reconhecimento) {
                try { reconhecimento.start(); } catch (_) {}
            }
        };
        window.speechSynthesis.speak(fala);
    }

    function inicializarVoz() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) return;
        reconhecimento = new SR();
        reconhecimento.lang = 'pt-BR';
        reconhecimento.continuous = false;
        reconhecimento.interimResults = false;
        reconhecimento.onstart = () => {
            document.getElementById('reator-visual').classList.add('ouvindo');
        };
        reconhecimento.onend = () => {
            document.getElementById('reator-visual').classList.remove('ouvindo');
            if (estado.ligacaoContinua && !window.speechSynthesis?.speaking) {
                setTimeout(() => { try { reconhecimento.start(); } catch (_) {} }, 300);
            }
        };
        reconhecimento.onerror = (e) => {
            if (e.error !== 'no-speech' && e.error !== 'aborted') console.warn('Voz erro:', e.error);
        };
        reconhecimento.onresult = (e) => {
            const cmd = e.results[0][0].transcript.trim();
            if (cmd) enviar(cmd);
        };
    }

    function toggleReator(n) {
        const btn = document.getElementById('reator-' + n);
        if (!btn) return;
        btn.classList.toggle('ativo');
        const ativo = btn.classList.contains('ativo');

        switch (n) {
            case 1:
                estado.vozAtiva = ativo;
                break;
            case 2:
                estado.ligacaoContinua = ativo;
                if (ativo && reconhecimento) {
                    try { reconhecimento.start(); } catch (_) {}
                } else if (reconhecimento) {
                    try { reconhecimento.stop(); } catch (_) {}
                }
                break;
            case 3:
                document.getElementById('scroll-wrapper').innerHTML = '';
                btn.classList.remove('ativo');
                adicionarMensagem('AETHER', 'Registro de tela limpo, Senhor.');
                break;
            case 4:
                btn.classList.remove('ativo');
                alert('Modo Flash Fast ativado.');
                break;
        }
    }
</script>
</body>
</html>
