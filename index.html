<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente Pessoal</title>
    
    <!-- Configurações para permitir salvar na tela inicial como App -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#111827">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #111827;
            color: #f3f4f6;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 15px;
        }
        header {
            text-align: center;
            padding: 10px 0;
            font-size: 1.2rem;
            font-weight: bold;
            color: #3b82f6;
            border-bottom: 1px solid #374151;
        }
        #chat {
            flex: 1;
            overflow-y: auto;
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 80%;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .user { align-self: flex-end; background-color: #2563eb; color: #fff; }
        .bot { align-self: flex-start; background-color: #1f2937; color: #e5e7eb; border: 1px solid #374151; }
        
        .controls {
            display: flex;
            gap: 8px;
            background-color: #1f2937;
            padding: 8px;
            border-radius: 8px;
        }
        input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
            padding: 8px;
            font-size: 1rem;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button.mic { background-color: #059669; }
    </style>
</head>
<body>

    <header>ASSISTENTE PESSOAL</header>

    <div id="chat">
        <div class="msg bot">Olá! Como posso te ajudar hoje?</div>
    </div>

    <div class="controls">
        <input type="text" id="userInput" placeholder="Digite ou fale..." onkeypress="checarEnter(event)">
        <button class="mic" onclick="ouvirVoz()">🎤</button>
        <button onclick="enviar()">Enviar</button>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('userInput');

        // Função para o assistente falar em voz alta igual a Alexa
        function falar(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Para falas anteriores
                const utterance = new SpeechSynthesisUtterance(texto);
                utterance.lang = 'pt-BR';
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Função para escutar a voz do usuário
        function ouvirVoz() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.lang = 'pt-BR';

                recognition.onstart = () => {
                    input.placeholder = "Ouvindo...";
                };

                recognition.onresult = (event) => {
                    const textoFalso = event.results[0][0].transcript;
                    input.value = textoFalso;
                    enviar();
                };

                recognition.onend = () => {
                    input.placeholder = "Digite ou fale...";
                };

                recognition.start();
            } else {
                alert("Navegador sem suporte a reconhecimento de voz.");
            }
        }

        function adicionarMensagem(autor, texto) {
            const div = document.createElement('div');
            div.className = `msg ${autor}`;
            div.innerText = texto;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function enviar() {
            const texto = input.value.trim();
            if (!texto) return;

            adicionarMensagem('user', texto);
            input.value = '';

            // Resposta de exemplo (aqui você pode conectar a qualquer API de IA)
            setTimeout(() => {
                const resposta = "Entendi o seu comando. Como posso ajudar a organizar isso para você?";
                adicionarMensagem('bot', resposta);
                falar(resposta); // Fala a resposta em voz alta
            }, 500);
        }

        function checarEnter(e) {
            if (e.key === 'Enter') enviar();
        }
    </script>
</body>
</html>
