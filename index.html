<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>AETHER OS | SYSTEM</title>
    <style>
        :root { --neon: #00f3ff; --bg: #030506; }
        body { background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; margin: 0; padding: 10px; height: 100vh; display: flex; flex-direction: column; }

        /* HEADER & REACTOR */
        header { border-bottom: 1px solid var(--neon); padding-bottom: 5px; margin-bottom: 10px; text-align: center; }
        .reactor { width: 80px; height: 80px; border: 2px solid var(--neon); border-radius: 50%; margin: 10px auto; box-shadow: 0 0 15px var(--neon); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 5px var(--neon); } 50% { box-shadow: 0 0 20px var(--neon); } 100% { box-shadow: 0 0 5px var(--neon); } }

        /* TERMINAL */
        #output { flex-grow: 1; overflow-y: auto; font-size: 0.9rem; margin-bottom: 10px; border: 1px solid #1a2a2b; padding: 10px; background: rgba(0,0,0,0.3); }
        .log { margin-bottom: 5px; border-bottom: 1px dashed #1a2a2b; padding-bottom: 2px; }

        /* CONTROLS - Estilo Sistema */
        .controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        button { background: #000; border: 1px solid var(--neon); color: var(--neon); padding: 10px 5px; cursor: pointer; font-size: 0.7rem; text-transform: uppercase; }
        button:active { background: var(--neon); color: #000; }
        input { background: #000; border: 1px solid var(--neon); color: #fff; width: 100%; padding: 10px; box-sizing: border-box; margin-bottom: 10px; }
    </style>
</head>
<body>

    <header>AETHER OS v2.0</header>
    <div class="reactor"></div>
    
    <div id="output">
        <div class="log">>> SISTEMA PRONTO.</div>
    </div>

    <input type="text" id="cmd" placeholder="DIGITE COMANDO OU PERGUNTA...">
    
    <div class="controls">
        <button onclick="send()">ENVIAR</button>
        <button onclick="clearLog()">LIMPAR</button>
        <button onclick="toggleFlash()">FLASH</button>
        <button onclick="toggleVoice()">VOZ</button>
    </div>

    <script>
        // LÓGICA DE CHAT
        async function send() {
            const input = document.getElementById('cmd');
            const output = document.getElementById('output');
            const msg = input.value;
            if(!msg) return;

            output.innerHTML += `<div class="log" style="color:#fff">> ${msg}</div>`;
            input.value = '';
            output.innerHTML += `<div class="log">> Processando...</div>`;

            try {
                // Requisição robusta
                const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(msg)}?seed=${Date.now()}`);
                const data = await res.text();
                
                // Remove o "Processando..." e mostra a resposta
                output.lastElementChild.remove();
                output.innerHTML += `<div class="log" style="color:var(--neon)">>> AETHER: ${data}</div>`;
            } catch(e) {
                output.lastElementChild.remove();
                output.innerHTML += `<div class="log" style="color:red">>> ERRO: FALHA NA REDE.</div>`;
            }
            output.scrollTop = output.scrollHeight;
        }

        // FUNÇÕES DE SISTEMA
        function clearLog() { document.getElementById('output').innerHTML = ''; }
        
        function toggleFlash() {
            // Flash simples
            document.body.style.filter = "invert(1)";
            setTimeout(() => document.body.style.filter = "invert(0)", 200);
        }

        function toggleVoice() {
            const synth = window.speechSynthesis;
            if(synth.speaking) synth.cancel();
            else alert("Sintetizador pronto.");
        }
    </script>
</body>
    </html>
