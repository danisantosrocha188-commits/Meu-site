<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AETHER OS</title>
    <style>
        :root {
            --main-color: #00f3ff;
            --bg-color: #030708;
            --err-color: #ff0055;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--main-color);
            font-family: var(--font-mono);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            overflow: hidden;
        }

        /* CABEÇALHO COM O GLOBO HOLOGRÁFICO (Canvas 3D) */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--main-color);
            padding-bottom: 5px;
            height: 45px;
        }

        .logo {
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 8px var(--main-color);
        }

        #globoCanvas {
            width: 35px;
            height: 35px;
            border-radius: 50%;
        }

        /* ÁREA DE MENSAGENS (CHAT) */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            margin: 10px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 5px;
        }

        .mensagem {
            font-size: 0.85rem;
            line-height: 1.3;
            word-break: break-word;
        }

        .mensagem.erro {
            color: var(--err-color);
            text-shadow: 0 0 5px var(--err-color);
        }

        /* REATOR CENTRAL COM ANIMAÇÃO GIRATÓRIA */
        .center-reactor {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 5px 0;
        }

        .core-outer {
            width: 55px;
            height: 55px;
            border: 2px dashed var(--main-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
            animation: spin 6s linear infinite;
        }

        .core-inner {
            width: 25px;
            height: 25px;
            border: 2px solid var(--main-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: spin-reverse 3s linear infinite;
        }

        .core-dot {
            width: 10px;
            height: 10px;
            background-color: var(--main-color);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--main-color);
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        @keyframes spin-reverse {
            100% { transform: rotate(-360deg); }
        }

        /* STATUS */
        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.6rem;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        /* ÁREA DE INPUT E BOTÕES */
        .controls-wrapper {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-area {
            display: flex;
            gap: 5px;
            border: 1px solid var(--main-color);
            padding: 4px;
            background: rgba(0, 243, 255, 0.05);
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--main-color);
            font-family: var(--font-mono);
            outline: none;
            padding: 5px;
            font-size: 0.85rem;
        }

        button.btn-send {
            background: transparent;
            border: 1px solid var(--main-color);
            color: var(--main-color);
            padding: 5px 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .reatores-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }

        .btn-reator {
            background: transparent;
            border: 1px solid var(--main-color);
            color: var(--main-color);
            font-size: 0.55rem;
            padding: 6px 2px;
            text-align: center;
            cursor: pointer;
        }

        .btn-reator.ativo {
            background: var(--main-color);
            color: var(--bg-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">AETHER OS</div>
        <canvas id="globoCanvas"></canvas>
    </header>

    <div id="chat-container">
        <div class="mensagem">>> AETHER: Sistemas operacionais prontos. Como posso ajudar, Senhor?</div>
    </div>

    <div class="center-reactor">
        <div class="core-outer">
            <div class="core-inner">
                <div class="core-dot"></div>
            </div>
        </div>
    </div>

    <div class="stats">
        <div>NUCLEO: 100% | TENSAO: 14.4V</div>
        <div style="text-align: right;">SISTEMA: POLLINATIONS | STATUS: ONLINE</div>
    </div>

    <div class="controls-wrapper">
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Inserir diretriz..." onkeypress="handleKeyPress(event)">
            <button class="btn-send" onclick="enviarMensagem()">>></button>
        </div>

        <div class="reatores-grid">
            <button class="btn-reator" id="reator-1" onclick="toggleReator(1)">REATOR 01<br>Feedback Voz</button>
            <button class="btn-reator" id="reator-2" onclick="toggleReator(2)">REATOR 02<br>Ligacao Cont.</button>
            <button class="btn-reator" id="reator-3" onclick="toggleReator(3)">REATOR 03<br>Limpar Tela</button>
            <button class="btn-reator" id="reator-4" onclick="toggleReator(4)">REATOR 04<br>Flash Fast</button>
        </div>
    </div>

    <script>
        let lanternaTrack = null;

        // 1. GLOBO HOLOGRÁFICO EM CANVAS
        const canvas = document.getElementById('globoCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 35;
        canvas.height = 35;
        let angle = 0;

        function drawGlobo() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const r = 14;

            ctx.strokeStyle = '#00f3ff';
            ctx.lineWidth = 1;

            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(cx, cy, r * Math.abs(Math.cos(angle)), r, 0, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(cx, cy, r, r * Math.abs(Math.sin(angle)), 0, 0, Math.PI * 2);
            ctx.stroke();

            angle += 0.03;
            requestAnimationFrame(drawGlobo);
        }
        drawGlobo();

        // 2. SISTEMA DE CHAT COM POLLINATIONS AI
        function adicionarMensagem(autor, texto, erro = false) {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = `mensagem ${erro ? 'erro' : ''}`;
            div.innerText = `${erro ? '!! ERRO: ' : '>> ' + autor + ': '}${texto}`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        async function enviarMensagem() {
            const input = document.getElementById('userInput');
            const texto = input.value.trim();
            if (!texto) return;

            adicionarMensagem('SENHOR', texto);
            input.value = '';

            try {
                const prompt = encodeURIComponent(`Você é o AETHER OS, assistente futurista do criador Daniel Santos. Responda de forma direta e curta como IA de Jarvis. Pergunta: ${texto}`);
                const response = await fetch(`https://text.pollinations.ai/${prompt}`);
                const reply = await response.text();

                if (reply) {
                    adicionarMensagem('AETHER', reply);
                } else {
                    adicionarMensagem('AETHER', 'Resposta vazia do sistema.', true);
                }
            } catch (err) {
                adicionarMensagem('AETHER', 'Falha ao conectar na rede.', true);
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') enviarMensagem();
        }

        // 3. REATORES (INCLUINDO FLASH REAL E LIMPEZA DE TELA)
        async function toggleReator(n) {
            const btn = document.getElementById('reator-' + n);
            if (!btn) return;
            btn.classList.toggle('ativo');
            const ativo = btn.classList.contains('ativo');

            switch (n) {
                case 1:
                    adicionarMensagem('AETHER', ativo ? 'Feedback por voz preparado.' : 'Voz desativada.');
                    break;
                case 2:
                    adicionarMensagem('AETHER', ativo ? 'Modo de escuta contínua ativado.' : 'Modo contínuo desligado.');
                    break;
                case 3:
                    document.getElementById('chat-container').innerHTML = '';
                    btn.classList.remove('ativo');
                    adicionarMensagem('AETHER', 'Registro de tela limpo, Senhor.');
                    break;
                case 4:
                    if (ativo) {
                        try {
                            const stream = await navigator.mediaDevices.getUserMedia({
                                video: { facingMode: 'environment' }
                            });
                            lanternaTrack = stream.getVideoTracks()[0];
                            const capabilities = lanternaTrack.getCapabilities();
                            
                            if (capabilities.torch) {
                                await lanternaTrack.applyConstraints({ advanced: [{ torch: true }] });
                                adicionarMensagem('AETHER', 'Sistemas iluminadores ativados, Senhor.');
                            } else {
                                adicionarMensagem('AETHER', 'Dispositivo sem suporte a iluminação LED.', true);
                                btn.classList.remove('ativo');
                            }
                        } catch (err) {
                            adicionarMensagem('AETHER', 'Permissão de câmera negada.', true);
                            btn.classList.remove('ativo');
                        }
                    } else {
                        if (lanternaTrack) {
                            lanternaTrack.stop();
                            lanternaTrack = null;
                        }
                        adicionarMensagem('AETHER', 'Sistemas iluminadores desligados.');
                    }
                    break;
            }
        }
    </script>
</body>
            </html>
