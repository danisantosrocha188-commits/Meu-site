<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHER OS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        html, body {
            background-color: #000000 !important;
            color: #00f0ff !important;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .interface-hud {
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
            padding: 10px;
            background: #000000;
        }

        /* CABEÇALHO COM LOGO E GLOBO */
        .topo-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 40px;
            padding: 0 5px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
        }

        .aether-logo-title {
            font-weight: bold;
            font-size: 1rem;
            color: #00f0ff;
            letter-spacing: 1px;
            text-shadow: 0 0 5px #00f0ff;
        }

        .globe-container {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #globeCanvas {
            width: 32px;
            height: 32px;
            display: block;
        }

        /* ÁREA DE CHAT E MENSAGENS */
        #scroll-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 10px 5px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: calc(100vh - 230px);
        }

        .chat-msg {
            position: relative;
            padding: 8px 35px 8px 10px;
            font-size: 0.85rem;
            color: #00f0ff;
            background: rgba(0, 240, 255, 0.03);
            word-break: break-word;
            line-height: 1.4;
            white-space: pre-wrap;
            border-left: 2px solid #00f0ff;
            border-radius: 2px;
        }

        .msg-options-btn {
            position: absolute;
            top: 4px;
            right: 6px;
            background: transparent;
            border: none;
            color: #00f0ff;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.8;
            padding: 0 4px;
        }

        .msg-menu-dropdown {
            display: none;
            position: absolute;
            top: 25px;
            right: 6px;
            background: #050d1a;
            border: 1px solid #ff0055;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
            z-index: 50;
            border-radius: 4px;
        }

        .msg-menu-dropdown.show {
            display: block;
        }

        .btn-delete-msg {
            background: transparent;
            color: #ff0055;
            border: none;
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-align: left;
            white-space: nowrap;
        }

        .btn-delete-msg:hover {
            background: #ff0055;
            color: #fff;
        }

        /* REATOR NÚCLEO CENTRAL */
        .reator-arc-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 6px 0;
        }

        .reator-arc {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px dashed #00f0ff;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            animation: girarReator 12s linear infinite;
        }

        .reator-nucleo {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #00f0ff;
            box-shadow: 0 0 20px #00f0ff;
        }

        @keyframes girarReator {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* PAINEL DE STATUS HUD */
        .status-painel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 0.6rem;
            color: #00f0ff;
        }

        .hud-coluna {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .hud-coluna.direita { text-align: right; }

        /* INPUT BAR */
        #input-bar {
            display: flex;
            gap: 5px;
            margin-bottom: 6px;
        }

        .caixa-texto {
            flex: 1;
            background: #000;
            border: 1px solid #00f0ff;
            color: #00f0ff;
            padding: 8px;
            font-size: 0.75rem;
            outline: none;
            resize: none;
            height: 38px;
        }

        .caixa-texto::placeholder {
            color: rgba(0, 240, 255, 0.4);
        }

        .btn-icone, .btn-enviar {
            background: #000;
            border: 1px solid #00f0ff;
            color: #00f0ff;
            width: 40px;
            height: 38px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-enviar {
            background: #00f0ff;
            color: #000;
            font-weight: bold;
        }

        /* PAINEL DE REATORES */
        #reactors-panel {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        .btn-reator {
            background: #000;
            border: 1px solid #00f0ff;
            color: #00f0ff;
            padding: 6px 2px;
            font-size: 0.6rem;
            text-align: center;
            cursor: pointer;
        }

        .btn-reator.ativo {
            background: #00f0ff;
            color: #000;
            box-shadow: 0 0 8px #00f0ff;
        }

        .btn-reator small {
            font-size: 0.5rem;
            display: block;
        }

        #attachment-preview-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px;
            border: 1px solid #00f0ff;
            margin-bottom: 5px;
        }

        #attached-img-thumb { width: 30px; height: 30px; object-fit: cover; }
        #attached-img-name { font-size: 0.7rem; flex: 1; }
        #btn-remove-attachment { background: transparent; border: none; color: #ff0055; cursor: pointer; }

        #media-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #close-modal-btn {
            background: #ff0055;
            color: #fff;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            margin-bottom: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="interface-hud">
        <header class="topo-hud">
            <span class="aether-logo-title">AETHER OS</span>
            <div class="globe-container">
                <canvas id="globeCanvas" width="32" height="32"></canvas>
            </div>
        </header>

        <main id="scroll-wrapper"></main>

        <div class="reator-arc-container">
            <div class="reator-arc">
                <div class="reator-nucleo"></div>
            </div>
        </div>

        <div class="status-painel">
            <div class="hud-coluna esquerda">
                <span>NÚCLEO: 100%</span>
                <span>TENSÃO: 14.4V</span>
                <span>TEMP: 21°C</span>
                <span>MODO: MULTIMÍDIA</span>
            </div>
            <div class="hud-coluna direita">
                <span>FREQ: 60Hz</span>
                <span>SISTEMA: MULTI_IA</span>
                <span>PORTAL: ATIVO</span>
                <span>STATUS: COMPILADO</span>
            </div>
        </div>

        <div id="attachment-preview-bar" style="display: none;">
            <img id="attached-img-thumb" src="" alt="Thumbnail">
            <span id="attached-img-name">Imagem Anexada</span>
            <button id="btn-remove-attachment" onclick="removerAnexo()">&#10005;</button>
        </div>

        <footer id="input-bar">
            <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="processarUploadImagem(event)">
            <button id="btn-attach" class="btn-icone" onclick="document.getElementById('file-input').click()">&#128206;</button>
            <textarea id="txt-input" class="caixa-texto" rows="1" placeholder="Digite uma pergunta ou diretriz..."></textarea>
            <button id="btn-send" class="btn-enviar" onclick="enviarDiretriz()">&gt;&gt;</button>
        </footer>

        <section id="reactors-panel">
            <button class="btn-reator" id="reator-1" onclick="toggleReator(1)">
                REATOR 01<br><small>Feedback Voz</small>
            </button>
            <button class="btn-reator" id="reator-2" onclick="toggleReator(2)">
                REATOR 02<br><small>Ligação Contínua</small>
            </button>
            <button class="btn-reator" id="reator-3" onclick="toggleReator(3)">
                REATOR 03<br><small>Limpar Tela</small>
            </button>
            <button class="btn-reator" id="reator-4" onclick="toggleReator(4)">
                REATOR 04<br><small>Flash Fast</small>
            </button>
        </section>
    </div>

    <div id="media-modal" onclick="fecharMedia()" style="display: none;">
        <button id="close-modal-btn" onclick="fecharMedia()">FECHAR [X]</button>
        <div id="modal-content" onclick="event.stopPropagation()"></div>
    </div>

    <script>
        let imagemAnexadaBase64 = null;
        let lanternaTrack = null;

        window.onload = function() {
            desenharGlobo3D();
            adicionarMensagem("AETHER OS", "Sistemas operacionais prontos. Como posso ajudar, Senhor?");
            
            document.addEventListener('click', function(e) {
                if (!e.target.classList.contains('msg-options-btn')) {
                    document.querySelectorAll('.msg-menu-dropdown').forEach(m => m.classList.remove('show'));
                }
            });
        };

        function desenharGlobo3D() {
            const canvas = document.getElementById("globeCanvas");
            if (!canvas) return;
            const ctx = canvas.getContext("2d");
            let angle = 0;

            function render() {
                ctx.clearRect(0, 0, 32, 32);
                ctx.strokeStyle = "#00f0ff";
                ctx.lineWidth = 1.2;
                ctx.shadowBlur = 4;
                ctx.shadowColor = "#00f0ff";

                const cx = 16, cy = 16, r = 12;

                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.stroke();

                ctx.beginPath();
                ctx.ellipse(cx, cy, r, Math.max(1, r * Math.abs(Math.sin(angle))), 0, 0, Math.PI * 2);
                ctx.stroke();

                ctx.beginPath();
                ctx.ellipse(cx, cy, Math.max(1, r * Math.abs(Math.cos(angle))), r, 0, 0, Math.PI * 2);
                ctx.stroke();

                angle += 0.04;
                requestAnimationFrame(render);
            }
            render();
        }

        async function enviarDiretriz() {
            const inputArea = document.getElementById("txt-input");
            const textoUsuario = inputArea ? inputArea.value.trim() : "";

            if (!textoUsuario && !imagemAnexadaBase64) return;

            adicionarMensagem("SENHOR", textoUsuario || "[Imagem enviada]");
            if (inputArea) inputArea.value = "";

            const idCarregando = adicionarMensagem("AETHER OS", "Consultando base de conhecimento...");

            let termoBusca = textoUsuario.replace(/^(o que é|o que e|quem foi|quem e|quem é|defina|o que significa)\s+/i, "");

            try {
                // Requisição pública segura sem chaves no código
                const response = await fetch(`https://pt.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(termoBusca)}`);
                
                if (response.ok) {
                    const data = await response.json();
                    if (data.extract) {
                        atualizarMensagem(idCarregando, "AETHER OS", data.extract);
                        return;
                    }
                }

                atualizarMensagem(idCarregando, "AETHER OS", `Diretriz "${textoUsuario}" registrada pelos núcleos do AETHER OS.`);

            } catch (error) {
                atualizarMensagem(idCarregando, "AETHER OS", `Resposta processada com sucesso para a diretriz: "${textoUsuario}".`);
            }
        }

        function adicionarMensagem(autor, texto) {
            const scrollWrapper = document.getElementById("scroll-wrapper");
            if (!scrollWrapper) return;

            const msgDiv = document.createElement("div");
            const idUnico = "msg-" + Date.now();

            msgDiv.id = idUnico;
            msgDiv.className = "chat-msg";
            msgDiv.innerHTML = `<strong>&gt;&gt; ${autor}:</strong> ${texto}`;

            adicionarOpcoesTresPontos(msgDiv);

            scrollWrapper.appendChild(msgDiv);
            scrollWrapper.scrollTop = scrollWrapper.scrollHeight;

            return idUnico;
        }

        function adicionarOpcoesTresPontos(msgDiv) {
            if (msgDiv.querySelector('.msg-options-btn')) return;

            const btnOpcoes = document.createElement("button");
            btnOpcoes.className = "msg-options-btn";
            btnOpcoes.innerHTML = "&#8942;";

            const menuDropdown = document.createElement("div");
            menuDropdown.className = "msg-menu-dropdown";

            const btnApagar = document.createElement("button");
            btnApagar.className = "btn-delete-msg";
            btnApagar.innerHTML = "&#128465; Apagar mensagem";

            btnApagar.onclick = (e) => {
                e.stopPropagation();
                msgDiv.remove();
            };

            menuDropdown.appendChild(btnApagar);
            msgDiv.appendChild(btnOpcoes);
            msgDiv.appendChild(menuDropdown);

            btnOpcoes.onclick = (e) => {
                e.stopPropagation();
                document.querySelectorAll('.msg-menu-dropdown').forEach(m => {
                    if (m !== menuDropdown) m.classList.remove('show');
                });
                menuDropdown.classList.toggle('show');
            };
        }

        function atualizarMensagem(id, autor, texto) {
            const msgDiv = document.getElementById(id);
            if (msgDiv) {
                msgDiv.innerHTML = `<strong>&gt;&gt; ${autor}:</strong> ${texto}`;
                adicionarOpcoesTresPontos(msgDiv);
                const scrollWrapper = document.getElementById("scroll-wrapper");
                if (scrollWrapper) scrollWrapper.scrollTop = scrollWrapper.scrollHeight;
            }
        }

        async function toggleReator(numero) {
            const btn = document.getElementById(`reator-${numero}`);
            if (btn) btn.classList.toggle("ativo");

            if (numero === 3) {
                const wrapper = document.getElementById("scroll-wrapper");
                if (wrapper) wrapper.innerHTML = "";
                adicionarMensagem("AETHER OS", "Memória central limpa.");
            }

            if (numero === 4) {
                const estaAtivo = btn.classList.contains("ativo");
                if (estaAtivo) {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({
                            video: { facingMode: 'environment' }
                        });
                        lanternaTrack = stream.getVideoTracks()[0];
                        await lanternaTrack.applyConstraints({
                            advanced: [{ torch: true }]
                        });
                        adicionarMensagem("AETHER OS", "LANTERNA ATIVADA.");
                    } catch (err) {
                        adicionarMensagem("AETHER OS", "O navegador bloqueou o acesso à lanterna ou o hardware não possui flash disponível.");
                        btn.classList.remove("ativo");
                    }
                } else {
                    if (lanternaTrack) {
                        lanternaTrack.stop();
                        lanternaTrack = null;
                    }
                    adicionarMensagem("AETHER OS", "LANTERNA DESLIGADA.");
                }
            }
        }

        function processarUploadImagem(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagemAnexadaBase64 = e.target.result;
                    document.getElementById("attachment-preview-bar").style.display = "flex";
                    document.getElementById("attached-img-thumb").src = imagemAnexadaBase64;
                };
                reader.readAsDataURL(file);
            }
        }

        function removerAnexo() {
            imagemAnexadaBase64 = null;
            document.getElementById("attachment-preview-bar").style.display = "none";
            document.getElementById("file-input").value = "";
        }

        function fecharMedia() {
            document.getElementById("media-modal").style.display = "none";
        }
    </script>
</body>
    </html>
