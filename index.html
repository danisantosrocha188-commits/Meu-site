<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AETHER OS</title>
    <style>
        :root { --main-color: #00f3ff; --bg-color: #030708; --err-color: #ff0055; --font-mono: 'Courier New', Courier, monospace; }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        html, body { width: 100%; height: 100%; background-color: var(--bg-color); color: var(--main-color); font-family: var(--font-mono); overflow: hidden; }
        .app-container { display: flex; flex-direction: column; height: 100vh; height: 100dvh; padding: 10px; gap: 8px; }
        #chat-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; border: 1px solid rgba(0, 243, 255, 0.15); padding: 8px; background: rgba(0, 243, 255, 0.02); border-radius: 4px; }
        .mensagem { font-size: 0.85rem; line-height: 1.3; word-break: break-word; }
        .input-area { display: flex; gap: 5px; border: 1px solid var(--main-color); padding: 4px; background: rgba(0, 243, 255, 0.05); border-radius: 3px; }
        input { flex: 1; background: transparent; border: none; color: var(--main-color); font-family: var(--font-mono); outline: none; padding: 6px; }
        .reatores-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .btn-reator { background: rgba(0, 243, 255, 0.03); border: 1px solid var(--main-color); color: var(--main-color); font-size: 0.55rem; padding: 8px 2px; text-align: center; cursor: pointer; }
        .btn-reator.ativo { background: var(--main-color); color: var(--bg-color); font-weight: bold; }
    </style>
</head>
<body>
    <div class="app-container">
        <header><div class="logo">AETHER OS</div></header>
        <div id="chat-container"></div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Inserir diretriz..." onkeypress="if(event.key==='Enter') enviarMensagem()">
            <button class="btn-send" onclick="enviarMensagem()">>></button>
        </div>
        <div class="reatores-grid">
            <button class="btn-reator" id="reator-1" onclick="toggleReator(1)">Voz</button>
            <button class="btn-reator" id="reator-2" onclick="toggleReator(2)">Lig. Cont.</button>
            <button class="btn-reator" id="reator-3" onclick="toggleReator(3)">Limpar</button>
            <button class="btn-reator" id="reator-4" onclick="toggleReator(4)">Flash</button>
        </div>
    </div>

    <script>
        let vozAtiva = false, ligacaoContinua = false, processando = false;
        
        async function conectarIA(texto) {
            // TENTATIVA 1: POLLINATIONS
            try {
                const res1 = await fetch(`https://text.pollinations.ai/${encodeURIComponent(texto)}?seed=${Math.floor(Math.random()*9999)}`);
                if(res1.ok) return await res1.text();
            } catch(e) {}

            // TENTATIVA 2: POPCAT (Backup sem trava)
            try {
                const res2 = await fetch(`https://api.popcat.xyz/chatbot?msg=${encodeURIComponent(texto)}`);
                const json2 = await res2.json();
                return json2.response;
            } catch(e) {
                return "Sistemas operacionais sobrecarregados. O canal principal de comunicação está offline, Senhor.";
            }
        }

        async function enviarMensagem() {
            const input = document.getElementById('userInput');
            const texto = input.value.trim();
            if (!texto || processando) return;
            
            processando = true;
            adicionarMsg('SENHOR', texto);
            input.value = '';

            const resposta = await conectarIA(texto);
            adicionarMsg('AETHER', resposta);
            if(vozAtiva) falar(resposta);
            
            processando = false;
        }

        function adicionarMsg(autor, txt) {
            const div = document.createElement('div');
            div.className = 'mensagem';
            div.innerText = `>> ${autor}: ${txt}`;
            document.getElementById('chat-container').appendChild(div);
        }

        function falar(t) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(t);
            u.lang = 'pt-BR';
            window.speechSynthesis.speak(u);
        }

        function toggleReator(n) {
            const b = document.getElementById('reator-'+n);
            b.classList.toggle('ativo');
            if(n===1) vozAtiva = b.classList.contains('ativo');
            if(n===3) document.getElementById('chat-container').innerHTML = '';
        }
    </script>
</body>
                </html>
